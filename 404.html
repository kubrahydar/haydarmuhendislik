<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Haydar Mühendislik</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1626;--gold:#d4a85a;--gold-2:#e6c07a;--text:#f3efe6;--muted:#aeb6c3}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;padding:24px;text-align:center}
.kod{font-family:Fraunces,Georgia,serif;font-size:clamp(80px,18vw,160px);font-weight:600;line-height:1;color:var(--gold)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);margin:8px 0 10px}
p{color:var(--muted);margin:0 0 28px}
a{display:inline-flex;gap:10px;padding:14px 26px;border-radius:999px;background:var(--gold);color:var(--bg);font-weight:600;text-decoration:none}
a:hover{background:var(--gold-2)}
</style>
</head>
<body>
<main>
  <div class="kod">404</div>
  <h1>Bu koordinatta bir sayfa yok.</h1>
  <p>Aradığınız sayfa taşınmış ya da kaldırılmış olabilir.</p>
  <a href="/">Ana sayfaya dön →</a>
</main>
</body>
</html>
